events {}

http {
    # Do not retain request queries (which may carry signed credentials).
    access_log off;
    error_log /dev/null;
    upstream core_service { server core:8081; }
    upstream media_service { server media:8082; }
    upstream recommendation_service { server recommendation-analytics:8083; }
    upstream web_app { server web:3000; }

    # Problem bodies written by Nginx carry a UUID correlation ID, as Media's own do.
    map $request_id $problem_id {
        "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" "$1-$2-$3-$4-$5";
    }
    # A stream or Media health request announcing a body (a GET has none).
    map "$http_content_length$http_transfer_encoding" $stream_body {
        "" "";
        default yes;
    }
    # Protected HLS (M29). Concurrent streams are bounded per playback session and per client address here, across
    # every Media instance behind this ingress; each Media instance also bounds its own share. $stream_session is set
    # from the stream location's own match, before its rewrite changes $uri.
    limit_conn_zone $stream_session zone=stream_session:1m;
    limit_conn_zone $binary_remote_addr zone=stream_client:1m;

    server {
        listen 80;
        client_max_body_size 10m;

        location ^~ /api/core/internal/ { return 404; }
        location ~ ^/(filer|master|volume|seaweedfs|s3|buckets|libra-source|libra-hls|dir|cluster|status)(/|$) { return 404; }

        location /api/core/ {
            proxy_pass http://core_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media's public surface is its health and the exact stream route below; nothing else beneath /api/media/ is
        # forwarded (M30). A spelling Nginx does not normalise into the stream route (a path parameter, an encoded
        # backslash, another case or version) would otherwise reach Media around the stream location's limits and
        # refusals, as would any endpoint Media adds later. A stream path that is not a session UUID and a name of the
        # HLS vocabulary lands here too.
        location /api/media/ {
            # No extension-based type (index.html, x.jpg): an Nginx-written answer is always a problem.
            types { }
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Not Found.","code":"NOT_FOUND","correlationId":"$problem_id"}';
        }

        # Without this, /api/media would fall through to the web app.
        location = /api/media {
            types { }
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Not Found.","code":"NOT_FOUND","correlationId":"$problem_id"}';
        }

        location ~ ^/api/media/actuator/health(/liveness|/readiness)?$ {
            # Public probes: a GET without a body, as on the stream route; nothing else reaches Media.
            types { }
            default_type application/problem+json;
            if ($request_method != GET) {
                add_header Cache-Control no-store always;
                return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"Forbidden.","code":"ACCESS_DENIED","correlationId":"$problem_id"}';
            }
            if ($stream_body) {
                add_header Cache-Control no-store always;
                return 400 '{"type":"about:blank","title":"Bad Request","status":400,"detail":"Bad Request.","code":"INVALID_REQUEST","correlationId":"$problem_id"}';
            }
            rewrite ^/api/media(/.*)$ $1 break;
            proxy_pass http://media_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/api/media/v1/streams/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(master\.m3u8|rendition\.m3u8|segment-[0-9]{5}\.ts)$" {
            # Every GET goes to Media, which verifies the ticket cookie; nothing here caches or authorizes.
            set $stream_session $1;
            types { }
            default_type application/problem+json;
            # Refused in the rewrite phase, before the limits count the request: a request whose announced body never
            # arrives would otherwise hold one of the session's streams for as long as it trickles. Media refuses
            # these methods too (403); a GET has no body.
            if ($request_method != GET) {
                add_header Cache-Control no-store always;
                return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"Forbidden.","code":"ACCESS_DENIED","correlationId":"$problem_id"}';
            }
            if ($stream_body) {
                add_header Cache-Control no-store always;
                return 400 '{"type":"about:blank","title":"Bad Request","status":400,"detail":"Bad Request.","code":"INVALID_REQUEST","correlationId":"$problem_id"}';
            }
            limit_conn stream_session 4;
            limit_conn stream_client 16;
            limit_conn_status 503;
            error_page 503 = @stream_busy;
            # Media unreachable or not answering in time: the same 503 as a storage failure, never an HTML page.
            error_page 502 504 = @stream_unavailable;
            rewrite ^/api/media(/.*)$ $1 break;
            proxy_pass http://media_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            # Buffer a little in memory to free Media from a slow player, but never spool protected media to disk:
            # past these buffers Nginx reads Media at the player's pace, so Media's transfer deadline still applies.
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
            proxy_max_temp_file_size 0;
        }

        # Media's own 503s pass through unchanged (no interception); this answers only Nginx's stream limits.
        location @stream_busy {
            types { }
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            add_header Retry-After 1 always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service Unavailable.","code":"MEDIA_UNAVAILABLE","correlationId":"$problem_id"}';
        }

        location @stream_unavailable {
            types { }
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service Unavailable.","code":"MEDIA_UNAVAILABLE","correlationId":"$problem_id"}';
        }

        location /api/recommendations/ {
            proxy_pass http://recommendation_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}


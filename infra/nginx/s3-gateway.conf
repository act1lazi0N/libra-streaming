events {}

http {
    # A signed query or Authorization header must never enter a proxy log.
    access_log off;
    error_log /dev/null;
    # Bound concurrent slow uploads per client and across this gateway.
    limit_conn_zone $binary_remote_addr zone=s3_client:1m;
    limit_conn_zone $server_port zone=s3_total:1m;
    server {
        listen 8333;
        limit_conn s3_client 8;
        limit_conn s3_total 64;
        limit_conn_status 429;
        client_header_timeout 10s;
        client_max_body_size 256m;
        client_body_timeout 30s;
        location ~ ^/libra-(source|hls)(/|$) {
            proxy_pass http://seaweedfs:8333;
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / { return 404; }
    }
}

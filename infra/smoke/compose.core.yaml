# Disposable Core acceptance environment. Never attach workstation volumes.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: smoke_local
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["127.0.0.1::8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
  core:
    build:
      context: ../..
      dockerfile: infra/smoke/core.Dockerfile
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/libra_core
      CORE_DB_USERNAME: libra_core
      CORE_DB_PASSWORD: core_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORE_MAIL_HOST: mailpit
      CORE_MAIL_STARTTLS: false
      CORE_LOCAL_DEVELOPMENT: true
      CORE_COOKIE_SECURE: false
      CORE_PUBLIC_BASE_URL: http://localhost
      CORE_JWT_KEY: ${LIBRA_SMOKE_JWT_KEY:?Run check-core.ps1}
      CORE_MAIL_ENCRYPTION_KEY: ${LIBRA_SMOKE_MAIL_KEY:?Run check-core.ps1}
      CORE_PLAYBACK_PRIVATE_KEY: ${LIBRA_SMOKE_PRIVATE_KEY:?Run check-core.ps1}
      CORE_PLAYBACK_PUBLIC_KEY: ${LIBRA_SMOKE_PUBLIC_KEY:?Run check-core.ps1}
      CORE_PLAYBACK_KEY_ID: smoke-playback
      CORE_BOOTSTRAP_ADMIN_EMAIL: admin@smoke.example.test
      CORE_BOOTSTRAP_ADMIN_PASSWORD: ${LIBRA_SMOKE_ADMIN_PASSWORD:?Run check-core.ps1}
      CORE_ANALYTICS_ENABLED: false
      CORE_MEDIA_SERVICE_AUTH_ENABLED: false
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_healthy }
  nginx:
    image: nginx:1.29.3-alpine
    ports: ["127.0.0.1::80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Resolve unused upstreams so the REAL ingress config can start. No requests
    # to those services are tested or claimed as successful by this smoke.
    extra_hosts:
      - "media:127.0.0.1"
      - "recommendation-analytics:127.0.0.1"
      - "web:127.0.0.1"
    depends_on: [core]

# Stand-in for Media behind the REAL ingress config in the M29 ingress-limit check. It answers slowly so concurrent
# requests overlap, echoes the path and cookie it received (the path also as X-Upstream-Uri), and answers one name
# with Media's own retryable 503.
events {}
http {
    access_log off;
    error_log /dev/null;
    server {
        listen 8082;
        location ~ /segment-00009\.ts$ {
            default_type application/problem+json;
            add_header Retry-After 1 always;
            return 503 '{"code":"MEDIA_UNAVAILABLE","from":"media"}';
        }
        location / {
            default_type text/plain;
            # The URI as Nginx forwarded it, readable before the slow body (M30 path matrix).
            add_header X-Upstream-Uri $request_uri always;
            limit_rate 32;
            # The M30 path matrix needs no overlap; it asks for full speed.
            if ($http_x_stub_fast) { set $limit_rate 0; }
            return 200 'uri=$request_uri cookie=$http_cookie authorization=$http_authorization ................................................\n';
        }
    }
}

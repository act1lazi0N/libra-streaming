name: libra-media-m09-smoke
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LIBRA_M09_POSTGRES_PASSWORD:?Set disposable smoke password}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

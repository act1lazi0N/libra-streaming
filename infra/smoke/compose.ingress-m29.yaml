# M29 ingress-limit check: the REAL infra/nginx/nginx.conf in front of a slow stand-in for Media
# (nginx-m29-stub.conf), so concurrent stream requests overlap deterministically. Run by check-media-m29.ps1.
services:
  media-stub:
    image: nginx:1.29.3-alpine
    volumes:
      - ./nginx-m29-stub.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        # Every upstream the ingress names resolves to the stand-in; only the stream location is exercised.
        aliases: [media, core, recommendation-analytics, web]
  nginx:
    image: nginx:1.29.3-alpine
    ports: ["127.0.0.1::80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [media-stub]

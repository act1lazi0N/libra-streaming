# M33 stand-in for the web upstream: serves only the test-only browser harness under /m33/. Not product UI.
events {}

http {
    access_log off;
    error_log /dev/null;
    types {
        text/html html;
        text/javascript js;
    }
    default_type application/octet-stream;

    server {
        listen 3000;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;

        location ^~ /m33/ {
            root /usr/share/libra-m33;
            index index.html;
        }

        location / { return 404; }
    }
}

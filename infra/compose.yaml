name: libra-streaming

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-libra_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-libra}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-libra_local_secret}
      S3_BUCKET: libra-source,libra-hls
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

  core:
    profiles: ["full"]
    build: { context: .., dockerfile: services/core/Dockerfile }
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/libra_core
      CORE_DB_USERNAME: libra_core
      CORE_DB_PASSWORD: core_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORE_MAIL_HOST: mailpit
      CORE_MAIL_PORT: 1025
      CORE_MAIL_STARTTLS: false
      CORE_JWT_KEY: ${CORE_JWT_KEY:-}
      CORE_PLAYBACK_PRIVATE_KEY: ${CORE_PLAYBACK_PRIVATE_KEY:-}
      CORE_PLAYBACK_PUBLIC_KEY: ${CORE_PLAYBACK_PUBLIC_KEY:-}
      CORE_PLAYBACK_KEY_ID: ${CORE_PLAYBACK_KEY_ID:-}
      CORE_MAIL_ENCRYPTION_KEY: ${CORE_MAIL_ENCRYPTION_KEY:-}
      CORE_LOCAL_DEVELOPMENT: ${CORE_LOCAL_DEVELOPMENT:-false}
      CORE_COOKIE_SECURE: ${CORE_COOKIE_SECURE:-true}
      CORE_PUBLIC_BASE_URL: ${CORE_PUBLIC_BASE_URL:-https://localhost}
      CORE_BOOTSTRAP_ADMIN_EMAIL: ${CORE_BOOTSTRAP_ADMIN_EMAIL:-}
      CORE_BOOTSTRAP_ADMIN_PASSWORD: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORE_MEDIA_LISTENER_ENABLED: ${CORE_MEDIA_LISTENER_ENABLED:-true}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  media:
    profiles: ["full"]
    build: { context: .., dockerfile: services/media/Dockerfile }
    environment:
      MEDIA_DB_URL: jdbc:postgresql://postgres:5432/libra_media
      MEDIA_DB_USERNAME: libra_media
      MEDIA_DB_PASSWORD: media_local
      MEDIA_S3_ENDPOINT: http://seaweedfs:8333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      seaweedfs: { condition: service_started }

  recommendation-analytics:
    profiles: ["full"]
    build: { context: .., dockerfile: services/recommendation-analytics/Dockerfile }
    environment:
      RECOMMENDATION_DB_URL: jdbc:postgresql://postgres:5432/libra_recommendation
      RECOMMENDATION_DB_USERNAME: libra_recommendation
      RECOMMENDATION_DB_PASSWORD: recommendation_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:
    profiles: ["full"]
    build: { context: ../web }
    environment:
      NODE_ENV: production

  nginx:
    profiles: ["full"]
    image: nginx:1.29.3-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core
      - media
      - recommendation-analytics
      - web

volumes:
  postgres-data:
  seaweedfs-data:

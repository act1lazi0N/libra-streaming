spring:
  application:
    name: core-service
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/libra_core}
    username: ${CORE_DB_USERNAME:libra_core}
    password: ${CORE_DB_PASSWORD:core_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${CORE_PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never


spring:
  application:
    name: recommendation-analytics-service
  datasource:
    url: ${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/libra_recommendation}
    username: ${RECOMMENDATION_DB_USERNAME:libra_recommendation}
    password: ${RECOMMENDATION_DB_PASSWORD:recommendation_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${RECOMMENDATION_PORT:8083}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never


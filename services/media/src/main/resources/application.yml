spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL}
    username: ${MEDIA_DB_USERNAME}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${MEDIA_PORT:8082}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,mediaStorage
      validate-group-membership: false # Storage can be explicitly disabled in persistence-only tests.
logging:
  level:
    software.amazon.awssdk: OFF # SDK diagnostics can contain signed requests and remote error bodies.
libra:
  media:
    worker:
      enabled: ${MEDIA_WORKER_ENABLED:false}
      poll-interval: ${MEDIA_WORKER_POLL_INTERVAL:1s}
      lease-duration: ${MEDIA_WORKER_LEASE_DURATION:30s}
      renew-interval: ${MEDIA_WORKER_RENEW_INTERVAL:5s}
      retry-delay: ${MEDIA_WORKER_RETRY_DELAY:10s}
      shutdown-timeout: ${MEDIA_WORKER_SHUTDOWN_TIMEOUT:10s}
    core-binding:
      enabled: ${MEDIA_CORE_BINDING_ENABLED:false}
      base-url: ${MEDIA_CORE_BINDING_BASE_URL:}
      private-key: ${MEDIA_CORE_BINDING_PRIVATE_KEY:}
      public-key: ${MEDIA_CORE_BINDING_PUBLIC_KEY:}
      key-id: ${MEDIA_CORE_BINDING_KEY_ID:}
      allow-http: ${MEDIA_CORE_BINDING_ALLOW_HTTP:false}
    core-service:
      enabled: ${MEDIA_CORE_SERVICE_AUTH_ENABLED:false}
      public-key: ${MEDIA_CORE_SERVICE_PUBLIC_KEY:}
      key-id: ${MEDIA_CORE_SERVICE_KEY_ID:}
    storage:
      enabled: ${MEDIA_STORAGE_ENABLED:true}
      internal-endpoint: ${MEDIA_S3_INTERNAL_ENDPOINT:}
      browser-endpoint: ${MEDIA_S3_BROWSER_ENDPOINT:}
      browser-origin: ${MEDIA_BROWSER_ORIGIN:}
      region: ${MEDIA_S3_REGION:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      source-bucket: ${MEDIA_SOURCE_BUCKET:}
      hls-bucket: ${MEDIA_HLS_BUCKET:}
      staging-prefix: ${MEDIA_STAGING_PREFIX:staging/}
      source-prefix: ${MEDIA_FROZEN_PREFIX:}
      hls-prefix: ${MEDIA_HLS_PREFIX:}
      connect-timeout: ${MEDIA_S3_CONNECT_TIMEOUT:}
      request-timeout: ${MEDIA_S3_REQUEST_TIMEOUT:}
      max-object-bytes: ${MEDIA_MAX_OBJECT_BYTES:0}
      scratch-directory: ${MEDIA_SCRATCH_DIRECTORY:}
      allow-http: ${MEDIA_S3_ALLOW_HTTP:false}
      initialize-buckets: ${MEDIA_STORAGE_INITIALIZE_BUCKETS:false}
      probe-on-startup: ${MEDIA_STORAGE_PROBE_ON_STARTUP:false}

